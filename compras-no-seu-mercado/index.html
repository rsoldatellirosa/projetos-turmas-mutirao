<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compras para seu mercado</title>
<!-- Deixa o app com ícone e tela cheia quando "adicionar à tela inicial" no celular -->
<meta name="theme-color" content="#5ec6ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%235ec6ff'/><path d='M100 140h44l54 210h150l40-140H168' fill='none' stroke='%23141414' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'/><circle cx='214' cy='396' r='24' fill='%23141414'/><circle cx='356' cy='396' r='24' fill='%23141414'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%235ec6ff'/><path d='M100 140h44l54 210h150l40-140H168' fill='none' stroke='%23141414' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'/><circle cx='214' cy='396' r='24' fill='%23141414'/><circle cx='356' cy='396' r='24' fill='%23141414'/></svg>">
<style>
  /* Cores do grupo: principal PRETO, destaque AZUL CLARO, fundo BRANCO */
  :root{
    --preto:#141414;        /* cor principal  */
    --azul:#5ec6ff;         /* cor de destaque (azul claro) */
    --azul-escuro:#1f93d6;
    --branco:#ffffff;       /* cor de fundo   */
    --cinza:#eef2f5;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;   /* fonte do sistema, sem internet */
    background:var(--branco);
    color:var(--preto);
  }
  /* O app cabe numa coluna estreita: funciona no celular e no computador */
  .app{ max-width:460px; margin:0 auto; min-height:100vh; padding:16px 18px 40px; }

  /* Cada tela é uma seção; só a tela com a classe "ativa" aparece */
  .tela{ display:none; }
  .tela.ativa{ display:block; }

  h1{ font-size:30px; text-align:center; margin:48px 0 28px; line-height:1.2; }
  h2{ font-size:22px; margin:0 0 6px; }
  .subtitulo{ font-size:16px; color:#555; margin:0 0 18px; }
  .carrinho{ font-size:46px; text-align:center; margin-bottom:8px; }

  button{ font-family:inherit; }
  .botao{
    display:block; width:100%; cursor:pointer;
    border:2px solid var(--preto); background:var(--branco); color:var(--preto);
    padding:14px; border-radius:12px; font-size:17px; text-align:center; margin:12px 0;
  }
  .botao:hover{ background:var(--cinza); }
  .botao-destaque{ background:var(--azul); border-color:var(--azul-escuro); font-weight:bold; }

  .voltar{
    background:none; border:none; color:var(--azul-escuro);
    font-size:16px; cursor:pointer; padding:6px 0; margin-bottom:10px;
  }

  .campo{
    width:100%; padding:12px; font-size:16px;
    border:2px solid #ccc; border-radius:12px; margin-bottom:18px;
  }

  /* Uma linha da lista (mercado, parte, produto ou comparação) */
  .item{
    display:flex; justify-content:space-between; align-items:center;
    border:2px solid var(--preto); border-radius:12px;
    padding:14px; margin:10px 0; cursor:pointer;
  }
  .item:hover{ background:var(--cinza); }
  .preco{ font-weight:bold; white-space:nowrap; margin-left:12px; }

  /* Destaque do mercado mais barato na tela de comparar */
  .mais-barato{ border-color:var(--azul-escuro); background:#e8f6ff; }
  .etiqueta{ display:block; font-size:13px; color:var(--azul-escuro); font-weight:bold; }

  .vazio{ color:#888; text-align:center; margin:30px 0; }
  .rodape{ text-align:center; color:#9aa4ab; font-size:13px; margin-top:34px; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== TELAS ===== -->

  <!-- Tela 1: Capa -->
  <section id="tela-capa" class="tela ativa">
    <div class="carrinho">🛒</div>
    <h1>Compras para seu mercado</h1>
    <!-- Só o botão "Ver mercados": a tela de dados pessoais foi tirada (Regras do Estúdio) -->
    <button class="botao botao-destaque" onclick="irParaMercados()">Ver mercados</button>
    <p class="rodape">Consciência financeira · Conhecimento · Tranquilidade<br>v0.2</p>
  </section>

  <!-- Tela 2: Digite sua cidade (só mostra os mercados de lá; nada é guardado) -->
  <section id="tela-cidade" class="tela">
    <h2>📍 Qual é a sua cidade?</h2>
    <!-- Aviso de privacidade: o app NÃO guarda dados de quem usa (Regras do Estúdio) -->
    <p class="subtitulo">Isso só mostra os mercados da sua cidade. O app não guarda nada sobre você.</p>
    <input id="campo-cidade" class="campo" placeholder="Digite sua cidade. Ex.: São Marcos" oninput="mostrarMercados(this.value)">
    <h2 id="titulo-mercados">Mercados</h2>
    <div id="lista-mercados"></div>
  </section>

  <!-- Tela 3: Um mercado (escolher a parte) -->
  <section id="tela-mercado" class="tela">
    <button class="voltar" onclick="abrirTela('tela-cidade')">← Voltar</button>
    <h2 id="titulo-mercado"></h2>
    <p class="subtitulo">Escolha a parte do mercado que você deseja</p>
    <div id="lista-partes"></div>
  </section>

  <!-- Tela 4: Uma parte (produtos e preços) -->
  <section id="tela-parte" class="tela">
    <button class="voltar" onclick="abrirTela('tela-mercado')">← Voltar</button>
    <h2 id="titulo-parte"></h2>
    <input id="campo-busca" class="campo" placeholder="🔍 Pesquisar produto" oninput="mostrarProdutos(this.value)">
    <div id="lista-produtos"></div>
  </section>

  <!-- Tela 5: Comparar um produto entre mercados -->
  <section id="tela-comparar" class="tela">
    <button class="voltar" onclick="abrirTela('tela-parte')">← Voltar</button>
    <h2 id="titulo-comparar"></h2>
    <p class="subtitulo" id="subtitulo-comparar"></p>
    <div id="lista-comparacao"></div>
  </section>

</div>

<script>
/* ===== DADOS =====
   Tabela "comida". Cada registro (linha) é um produto em um mercado.
   Campos (colunas): nome, parte, preco, mercado, cidade.
   A fonte é o dados.csv do grupo. Os dados abaixo são de EXEMPLO,
   só para mostrar mais alimentos e mais partes do mercado;
   trocar pelos dados de verdade no /dados. */
const dados = [
  // Tudo aqui é EXEMPLO — trocar pela tabela do grupo (/dados)

  // Açougue
  { nome: "Bife bovino (kg)",   parte: "Açougue",    preco: 34.90, mercado: "Mercado São Jorge",  cidade: "São Marcos" },
  { nome: "Bife bovino (kg)",   parte: "Açougue",    preco: 31.50, mercado: "Mercado Boa Compra", cidade: "São Marcos" },

  // Padaria
  { nome: "Pão francês (kg)",   parte: "Padaria",    preco: 14.90, mercado: "Mercado São Jorge",  cidade: "São Marcos" },
  { nome: "Pão francês (kg)",   parte: "Padaria",    preco: 12.50, mercado: "Mercado Economia",   cidade: "São Marcos" },

  // Hortifrúti
  { nome: "Maçã (kg)",          parte: "Hortifrúti", preco: 8.90,  mercado: "Mercado Boa Compra", cidade: "São Marcos" },
  { nome: "Maçã (kg)",          parte: "Hortifrúti", preco: 7.99,  mercado: "Mercado Economia",   cidade: "São Marcos" },
  { nome: "Banana (kg)",        parte: "Hortifrúti", preco: 5.49,  mercado: "Mercado São Jorge",  cidade: "São Marcos" },
  { nome: "Banana (kg)",        parte: "Hortifrúti", preco: 4.99,  mercado: "Mercado Boa Compra", cidade: "São Marcos" },

  // Cereais
  { nome: "Arroz 5kg",          parte: "Cereais",    preco: 27.90, mercado: "Mercado São Jorge",  cidade: "São Marcos" },
  { nome: "Arroz 5kg",          parte: "Cereais",    preco: 24.50, mercado: "Mercado Boa Compra", cidade: "São Marcos" },
  { nome: "Arroz 5kg",          parte: "Cereais",    preco: 25.90, mercado: "Mercado Economia",   cidade: "São Marcos" },
  { nome: "Feijão 1kg",         parte: "Cereais",    preco: 8.49,  mercado: "Mercado São Jorge",  cidade: "São Marcos" },
  { nome: "Feijão 1kg",         parte: "Cereais",    preco: 7.90,  mercado: "Mercado Economia",   cidade: "São Marcos" },

  // Bebidas
  { nome: "Leite 1L",           parte: "Bebidas",    preco: 4.80,  mercado: "Mercado São Jorge",  cidade: "São Marcos" },
  { nome: "Leite 1L",           parte: "Bebidas",    preco: 4.49,  mercado: "Mercado Boa Compra", cidade: "São Marcos" },
  { nome: "Suco de laranja 1L", parte: "Bebidas",    preco: 9.90,  mercado: "Mercado Boa Compra", cidade: "São Marcos" },
  { nome: "Suco de laranja 1L", parte: "Bebidas",    preco: 8.75,  mercado: "Mercado Economia",   cidade: "São Marcos" },

  // Extra
  { nome: "Sabão em pó 1kg",    parte: "Extra",      preco: 15.90, mercado: "Mercado São Jorge",  cidade: "São Marcos" },
  { nome: "Sabão em pó 1kg",    parte: "Extra",      preco: 13.99, mercado: "Mercado Economia",   cidade: "São Marcos" }
];

/* ===== LÓGICA ===== */

// Lembra o que a pessoa escolheu enquanto navega pelas telas
let cidadeAtual  = "";
let mercadoAtual = "";
let parteAtual   = "";

// Mostra o preço no formato R$ 00,00
function formatarPreco(valor){
  return "R$ " + valor.toFixed(2).replace(".", ",");
}

// Troca a tela que está na frente
function abrirTela(id){
  document.querySelectorAll(".tela").forEach(t => t.classList.remove("ativa"));
  document.getElementById(id).classList.add("ativa");
}

// Botão "Ver mercados" da capa: abre a tela de cidade e já lista todos os mercados
function irParaMercados(){
  abrirTela("tela-cidade");
  mostrarMercados(document.getElementById("campo-cidade").value);
}

// Monta a lista de mercados da cidade digitada
function mostrarMercados(textoCidade){
  // SELECT DISTINCT mercado, cidade FROM comida WHERE cidade LIKE '%textoCidade%'
  const busca = textoCidade.trim().toLowerCase();
  const encontrados = [];        // guarda cada mercado só uma vez
  dados.forEach(linha => {
    if (linha.cidade.toLowerCase().includes(busca)){
      const jaTem = encontrados.some(m => m.mercado === linha.mercado && m.cidade === linha.cidade);
      if (!jaTem) encontrados.push({ mercado: linha.mercado, cidade: linha.cidade });
    }
  });

  // Atualiza o título mostrando quantos mercados apareceram
  const titulo = document.getElementById("titulo-mercados");
  titulo.textContent = encontrados.length ? "Mercados (" + encontrados.length + ")" : "Mercados";

  const lista = document.getElementById("lista-mercados");
  if (encontrados.length === 0){
    lista.innerHTML = "<p class='vazio'>Nenhum mercado encontrado nessa cidade.</p>";
    return;
  }
  lista.innerHTML = "";
  encontrados.forEach(m => {
    const linha = document.createElement("div");
    linha.className = "item";
    linha.textContent = m.mercado;
    linha.onclick = () => abrirMercado(m.mercado, m.cidade);
    lista.appendChild(linha);
  });
}

// Abre um mercado e mostra as partes (seções) dele
function abrirMercado(mercado, cidade){
  mercadoAtual = mercado;
  cidadeAtual  = cidade;
  document.getElementById("titulo-mercado").textContent = mercado;
  abrirTela("tela-mercado");

  // SELECT DISTINCT parte FROM comida WHERE mercado = mercadoAtual
  const partes = [];
  dados.forEach(linha => {
    if (linha.mercado === mercadoAtual && !partes.includes(linha.parte)){
      partes.push(linha.parte);
    }
  });

  const lista = document.getElementById("lista-partes");
  lista.innerHTML = "";
  partes.forEach(parte => {
    const botao = document.createElement("button");
    botao.className = "botao";
    botao.textContent = parte;
    botao.onclick = () => abrirParte(parte);
    lista.appendChild(botao);
  });
}

// Abre uma parte do mercado e prepara a lista de produtos
function abrirParte(parte){
  parteAtual = parte;
  document.getElementById("titulo-parte").textContent = parte + " · " + mercadoAtual;
  document.getElementById("campo-busca").value = "";
  abrirTela("tela-parte");
  mostrarProdutos("");
}

// Monta a lista de produtos da parte, podendo filtrar pela busca
function mostrarProdutos(busca){
  // SELECT nome, preco FROM comida
  // WHERE mercado = mercadoAtual AND parte = parteAtual AND nome LIKE '%busca%'
  const texto = busca.trim().toLowerCase();
  const produtos = dados.filter(linha =>
    linha.mercado === mercadoAtual &&
    linha.parte === parteAtual &&
    linha.nome.toLowerCase().includes(texto)
  );

  const lista = document.getElementById("lista-produtos");
  if (produtos.length === 0){
    lista.innerHTML = "<p class='vazio'>Nenhum produto encontrado.</p>";
    return;
  }
  lista.innerHTML = "";
  produtos.forEach(p => {
    const linha = document.createElement("div");
    linha.className = "item";
    linha.innerHTML = "<span>" + p.nome + "</span><span class='preco'>" + formatarPreco(p.preco) + "</span>";
    linha.onclick = () => compararProduto(p.nome);   // tocar no produto abre a comparação
    lista.appendChild(linha);
  });
}

// Mostra o preço do mesmo produto em cada mercado da cidade (comparação)
function compararProduto(nome){
  document.getElementById("titulo-comparar").textContent = nome;
  document.getElementById("subtitulo-comparar").textContent = "Preço em cada mercado de " + cidadeAtual;
  abrirTela("tela-comparar");

  // SELECT mercado, preco FROM comida
  // WHERE nome = nome AND cidade = cidadeAtual ORDER BY preco
  const comparacao = dados
    .filter(linha => linha.nome === nome && linha.cidade === cidadeAtual)
    .sort((a, b) => a.preco - b.preco);   // do mais barato para o mais caro

  const lista = document.getElementById("lista-comparacao");
  lista.innerHTML = "";
  comparacao.forEach((linha, posicao) => {
    const item = document.createElement("div");
    // SE for o primeiro da lista ordenada, ENTÃO é o mais barato
    const ehMaisBarato = (posicao === 0);
    item.className = ehMaisBarato ? "item mais-barato" : "item";
    const etiqueta = ehMaisBarato ? "<span class='etiqueta'>💚 Mais barato</span>" : "";
    item.innerHTML = "<span>" + linha.mercado + etiqueta + "</span>" +
                     "<span class='preco'>" + formatarPreco(linha.preco) + "</span>";
    lista.appendChild(item);
  });
}
</script>
</body>
</html>
