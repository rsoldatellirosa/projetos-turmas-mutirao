<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameData · Ranking de Jogos</title>
<style>
  /* Paleta escura (pedido do grupo na v0.2). Troque os valores aqui para mudar as cores. */
  :root {
    --cor-principal:   #2a2d5a;   /* faixa do topo e botões (azul escuro) */
    --cor-destaque:    #ffb23e;   /* nota e números do ranking (âmbar) */
    --cor-fundo:       #0f1018;   /* fundo da tela (quase preto) */
    --cor-cartao:      #1b1d2e;   /* fundo dos cartões (cinza escuro) */
    --cor-texto:       #eceef5;   /* texto principal (claro) */
    --cor-texto-sec:   #9aa0b5;   /* texto secundário (cinza claro) */
    --cor-borda:       rgba(255,255,255,.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* Fonte do sistema, sem internet */
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--cor-fundo);
    color: var(--cor-texto);
  }

  /* Animações de entrada (pedido do grupo na v0.2) */
  @keyframes descer   { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes aparecer { from { opacity: 0; transform: translateY(12px);  } to { opacity: 1; transform: translateY(0); } }

  /* Tela de introdução (pedido do grupo na v0.3) */
  @keyframes introEntra { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes introSai   { from { opacity: 1; } to { opacity: 0; } }

  #telaIntro {
    position: fixed;
    inset: 0;                         /* cobre a tela inteira */
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--cor-fundo);
    cursor: pointer;                  /* pode tocar para pular */
    animation: introEntra .7s ease both;
  }
  #telaIntro.saindo { animation: introSai .5s ease forwards; }   /* some suavemente */
  #telaIntro .logo    { font-size: 4.5rem; animation: descer .7s ease both; }
  #telaIntro .titulo  { font-size: 2.6rem; font-weight: bold; margin: 10px 0 0; letter-spacing: 1px; }
  #telaIntro .legenda { color: var(--cor-texto-sec); margin-top: 6px; font-size: .95rem; }
  #telaIntro .toque   { color: var(--cor-texto-sec); margin-top: 28px; font-size: .8rem; opacity: .7; }

  /* Faixa do topo */
  header {
    background: var(--cor-principal);
    color: #fff;
    padding: 18px 16px;
    text-align: center;
    animation: descer .5s ease both;
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p  { margin: 4px 0 0; font-size: .9rem; opacity: .85; }

  /* O app todo centralizado e estreito (fica bom no celular e no PC) */
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
  }

  /* Barra de pesquisa + filtros (pedido do grupo na v0.3) */
  .barra-busca {
    display: flex;
    flex-wrap: wrap;                  /* quebra em duas linhas no celular estreito */
    gap: 8px;
    margin-bottom: 14px;
  }
  .barra-busca input,
  .barra-busca select {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--cor-borda);
    background: var(--cor-cartao);
    color: var(--cor-texto);
    font-size: .95rem;
  }
  .barra-busca input  { flex: 1 1 150px; min-width: 0; }   /* campo de texto estica */
  .barra-busca select { flex: 1 1 150px; cursor: pointer; }

  /* Aviso quando a busca não encontra nenhum jogo */
  .vazio {
    text-align: center;
    color: var(--cor-texto-sec);
    padding: 30px 10px;
  }

  /* Cada jogo na lista do ranking */
  .item-jogo {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--cor-cartao);
    border: 1px solid var(--cor-borda);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    font-size: 1rem;
    color: var(--cor-texto);
    animation: aparecer .45s ease both;
  }
  .item-jogo:hover { border-color: var(--cor-destaque); }

  /* A posição no ranking (1, 2, 3...) */
  .posicao {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--cor-destaque);
    min-width: 24px;
    text-align: center;
  }

  .info-item { flex: 1; }
  .info-item .nome   { font-weight: 600; }
  .info-item .genero { font-size: .85rem; color: var(--cor-texto-sec); }

  /* A nota em destaque */
  .nota {
    background: var(--cor-destaque);
    color: #1d1d28;
    font-weight: bold;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 1.05rem;
  }

  /* Capa (foto) do jogo */
  .capa {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 14px;
    display: block;
  }
  .capa-mini {
    width: 46px;
    height: 46px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }
  /* Espaço reservado quando o jogo ainda não tem foto */
  .sem-foto {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2a2d5a, #3a3f6b);
    color: var(--cor-texto-sec);
  }
  .capa.sem-foto      { font-size: 3rem; }
  .capa-mini.sem-foto { font-size: 1.4rem; }
  .sem-foto span { font-size: .8rem; margin-top: 6px; }

  /* Tela de detalhe */
  .detalhe {
    background: var(--cor-cartao);
    border: 1px solid var(--cor-borda);
    border-radius: 12px;
    padding: 20px;
    animation: aparecer .4s ease both;
  }
  .detalhe h2 { margin-top: 0; }
  .linha {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--cor-borda);
  }
  .linha .rotulo { color: var(--cor-texto-sec); }
  .linha .valor  { font-weight: 600; }
  .descricao { margin-top: 16px; line-height: 1.5; }

  button.voltar {
    margin-bottom: 16px;
    background: var(--cor-principal);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 1rem;
    cursor: pointer;
  }

  /* Esconde a tela que não está sendo usada */
  .escondida { display: none; }

  /* Respeita quem prefere menos animação no celular */
  @media (prefers-reduced-motion: reduce) {
    header, .item-jogo, .detalhe, #telaIntro, #telaIntro .logo { animation: none; }
  }
</style>
  <!-- PWA:head:inicio (gerado pelo pwa-kit, nao editar a mao) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2a2d5a">
  <link rel="apple-touch-icon" href="icone-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GameData">
  <!-- PWA:head:fim -->
</head>
<body>

<!-- Tela de introdução: aparece ao abrir e some sozinha depois de ~2 segundos -->
<section id="telaIntro" onclick="fecharIntro()">
  <div class="logo">🎮</div>
  <div class="titulo">GameData</div>
  <div class="legenda">Ranking de jogos</div>
  <div class="toque">toque para começar</div>
</section>

<header>
  <h1>🎮 GameData</h1>
  <p>Ranking de jogos mais bem avaliados</p>
</header>

<main>
  <!-- ===== TELAS ===== -->

  <!-- Tela 1: Ranking (barra de pesquisa + lista dos jogos) -->
  <section id="telaRanking">
    <div class="barra-busca">
      <!-- Campo de texto: filtra pelos nomes enquanto a pessoa digita -->
      <input id="campoBusca" type="text" placeholder="Pesquisar jogo..." oninput="aoBuscar(this.value)">
      <!-- Lista de filtros de ordenação (pedido do grupo na v0.3) -->
      <select id="campoOrdem" onchange="aoOrdenar(this.value)">
        <option value="nota-alta">Nota mais alta</option>
        <option value="nota-baixa">Nota mais baixa</option>
        <option value="fat-alta">Maior faturamento</option>
        <option value="fat-baixa">Menor faturamento</option>
        <option value="pesquisado">Mais pesquisado</option>
      </select>
    </div>
    <div id="listaRanking"></div>
  </section>

  <!-- Tela 2: Detalhe de um jogo (começa escondida) -->
  <section id="telaDetalhe" class="escondida"></section>
</main>

<script>
/* ===== DADOS ===== */
/* Tabela "jogos". A fonte é o dados.csv do grupo.
   ATENÇÃO, GRUPO: as NOTAS e os FATURAMENTOS abaixo são valores de REFERÊNCIA
   (notas no estilo Metacritic e faturamentos aproximados). CONFIRAM e ajustem
   os números de vocês no dados.csv. Casos especiais marcados em cada linha:
   GTA 6 ainda não foi lançado e BeamNG.Drive está em acesso antecipado.

   O campo "foto" guarda a imagem do jogo em base64 (texto que começa com
   "data:image/..."). Enquanto estiver vazio (""), o app mostra um espaço
   reservado "foto em breve". Coloquem as fotos na pasta imagens/ e me peçam
   para embutir; aí este campo recebe a imagem.

   O campo "pesquisas" começa em 0 e conta quantas vezes o jogo foi aberto
   nesta sessão (serve para o filtro "mais pesquisado"). Nada é guardado de
   ninguém: ao recarregar a página, a contagem volta a zero. */
const dados = [
  { nome: "The Legend of Zelda: Ocarina of Time", nota: 9.9, faturamento: 300,  genero: "Aventura",            foto: "", pesquisas: 0, descricao: "Link viaja no tempo para salvar o reino de Hyrule." },
  { nome: "Grand Theft Auto V",                    nota: 9.7, faturamento: 8000, genero: "Ação / Mundo aberto", foto: "", pesquisas: 0, descricao: "Três criminosos se unem em assaltos na cidade de Los Santos." },
  { nome: "The Legend of Zelda: Breath of the Wild", nota: 9.7, faturamento: 1000, genero: "Aventura / Mundo aberto", foto: "", pesquisas: 0, descricao: "Explore o reino de Hyrule livremente e enfrente Ganon." },
  { nome: "Red Dead Redemption 2",                 nota: 9.7, faturamento: 1900, genero: "Ação / Mundo aberto", foto: "", pesquisas: 0, descricao: "A vida de um fora da lei no faroeste americano." },
  { nome: "Grand Theft Auto VI",                   nota: 9.6, faturamento: 0,    genero: "Ação / Mundo aberto", foto: "", pesquisas: 0, descricao: "Novo jogo da série GTA. Ainda não foi lançado — nota e faturamento são uma estimativa a confirmar." },
  { nome: "Minecraft",                             nota: 9.5, faturamento: 3000, genero: "Sandbox",             foto: "", pesquisas: 0, descricao: "Um mundo de blocos onde você constrói e explora do seu jeito." },
  { nome: "Celeste",                               nota: 9.2, faturamento: 120,  genero: "Plataforma",          foto: "", pesquisas: 0, descricao: "Uma garota escala uma montanha em uma aventura difícil e emocionante." },
  { nome: "Stardew Valley",                        nota: 9.0, faturamento: 300,  genero: "Simulação",           foto: "", pesquisas: 0, descricao: "Você cuida de uma fazenda e faz amizades em uma cidade pequena." },
  { nome: "Far Cry 4",                             nota: 8.5, faturamento: 600,  genero: "Ação / Tiro",         foto: "", pesquisas: 0, descricao: "Um país fictício do Himalaia dominado por um ditador." },
  { nome: "Need for Speed: Most Wanted",           nota: 8.3, faturamento: 400,  genero: "Corrida",             foto: "", pesquisas: 0, descricao: "Corridas de rua fugindo da polícia." },
  { nome: "BeamNG.drive",                          nota: 8.0, faturamento: 100,  genero: "Simulação / Corrida", foto: "", pesquisas: 0, descricao: "Simulador de carros com física realista de batidas. Está em acesso antecipado — nota a confirmar." }
];

/* ===== LÓGICA ===== */

// Guarda o que a pessoa digitou na busca e qual filtro ela escolheu.
let textoBusca = "";
let ordemAtual = "nota-alta";

// Filtra pelos nomes e depois coloca na ordem escolhida.
// SELECT nome, nota, faturamento, genero, foto FROM jogos
//   WHERE nome LIKE '%texto%' ORDER BY (campo escolhido)
function filtrarEOrdenar() {
  // 1) FILTRO: fica só com os jogos cujo nome contém o texto digitado
  const busca = textoBusca.toLowerCase();
  let lista = dados.filter(function (jogo) {
    return jogo.nome.toLowerCase().includes(busca);
  });

  // 2) ORDEM: organiza a lista conforme o filtro escolhido (SE/ENTÃO)
  lista = lista.slice().sort(function (a, b) {
    if (ordemAtual === "nota-alta")  return b.nota - a.nota;              // ORDER BY nota DESC
    if (ordemAtual === "nota-baixa") return a.nota - b.nota;             // ORDER BY nota ASC
    if (ordemAtual === "fat-alta")   return b.faturamento - a.faturamento; // ORDER BY faturamento DESC
    if (ordemAtual === "fat-baixa")  return a.faturamento - b.faturamento; // ORDER BY faturamento ASC
    if (ordemAtual === "pesquisado") return b.pesquisas - a.pesquisas;   // ORDER BY pesquisas DESC
    return 0;
  });

  return lista;
}

// Quando a pessoa digita na busca: guarda o texto e redesenha o ranking.
function aoBuscar(texto) {
  textoBusca = texto;
  desenharRanking();
}

// Quando a pessoa troca o filtro: guarda a escolha e redesenha o ranking.
function aoOrdenar(ordem) {
  ordemAtual = ordem;
  desenharRanking();
}

// Monta a capa (foto) do jogo.
// SE o jogo tem foto, mostra a foto; SENÃO, mostra um espaço reservado.
function capaDoJogo(jogo, classe) {
  if (jogo.foto !== "") {
    return `<img class="${classe}" src="${jogo.foto}" alt="Foto de ${jogo.nome}">`;
  } else {
    const aviso = (classe === "capa") ? "<span>foto em breve</span>" : "";
    return `<div class="${classe} sem-foto">🎮${aviso}</div>`;
  }
}

// Mostra a tela de detalhe de um jogo escolhido.
// SELECT nome, nota, faturamento, genero, foto, descricao FROM jogos WHERE nome = ...
function mostrarDetalhe(indice) {
  const jogo = dados[indice];
  // Conta +1 pesquisa deste jogo (usado no filtro "mais pesquisado")
  jogo.pesquisas = jogo.pesquisas + 1;
  desenharDetalhe(jogo);
  // Troca de tela: esconde o ranking, mostra o detalhe
  document.getElementById("telaRanking").classList.add("escondida");
  document.getElementById("telaDetalhe").classList.remove("escondida");
}

// Volta do detalhe para o ranking (redesenha para atualizar a contagem e a ordem).
function voltar() {
  document.getElementById("telaDetalhe").classList.add("escondida");
  document.getElementById("telaRanking").classList.remove("escondida");
  desenharRanking();
}

// Fecha a tela de introdução.
function fecharIntro() {
  const intro = document.getElementById("telaIntro");
  if (intro.style.display === "none") return;   // já fechou, não faz de novo
  intro.classList.add("saindo");                // some suavemente (opacidade)
  // Depois da animação de saída, tira a tela da frente para liberar os cliques
  setTimeout(function () { intro.style.display = "none"; }, 500);
}

/* ===== TELAS ===== */

// Desenha a lista do ranking na Tela 1.
function desenharRanking() {
  const jogos = filtrarEOrdenar();
  let html = "";

  // SE a busca não achou nenhum jogo, mostra um aviso
  if (jogos.length === 0) {
    document.getElementById("listaRanking").innerHTML = `<p class="vazio">Nenhum jogo encontrado.</p>`;
    return;
  }

  // Para cada jogo, cria um botão clicável com posição, foto, nome, gênero e nota.
  for (let i = 0; i < jogos.length; i++) {
    const jogo = jogos[i];
    // Descobre a posição do jogo na lista original, para abrir o detalhe certo
    const indiceOriginal = dados.indexOf(jogo);
    html += `
      <button class="item-jogo" onclick="mostrarDetalhe(${indiceOriginal})" style="animation-delay: ${i * 0.06}s">
        <span class="posicao">${i + 1}</span>
        ${capaDoJogo(jogo, "capa-mini")}
        <span class="info-item">
          <div class="nome">${jogo.nome}</div>
          <div class="genero">${jogo.genero}</div>
        </span>
        <span class="nota">${jogo.nota}</span>
      </button>`;
  }

  document.getElementById("listaRanking").innerHTML = html;
}

// Desenha a Tela 2 com os dados de um jogo.
function desenharDetalhe(jogo) {
  document.getElementById("telaDetalhe").innerHTML = `
    <button class="voltar" onclick="voltar()">← Voltar</button>
    <div class="detalhe">
      ${capaDoJogo(jogo, "capa")}
      <h2>${jogo.nome}</h2>
      <div class="linha"><span class="rotulo">Nota</span><span class="valor">${jogo.nota}</span></div>
      <div class="linha"><span class="rotulo">Gênero</span><span class="valor">${jogo.genero}</span></div>
      <div class="linha"><span class="rotulo">Faturamento (milhões)</span><span class="valor">${jogo.faturamento}</span></div>
      <div class="linha"><span class="rotulo">Vezes aberto</span><span class="valor">${jogo.pesquisas}</span></div>
      <p class="descricao">${jogo.descricao}</p>
    </div>`;
}

// Quando a página abre, desenha o ranking (atrás da tela de introdução)
// e fecha a introdução sozinho depois de 2 segundos.
desenharRanking();
setTimeout(fecharIntro, 2000);
</script>

      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

  <!-- PWA:registro:fim -->
</body>
</html>
